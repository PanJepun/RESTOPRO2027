<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>v19 TEST MASUK</title>
<style>body{margin:0;font-family:sans-serif;background:#f8fafc;padding-bottom:500px}.h{background:#10b981;color:#fff;padding:12px;text-align:center;font-weight:800;position:sticky;top:0;z-index:5}.g{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}.c{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 6px #0001}.c img{width:100%;height:110px;object-fit:cover;background:#eee}.p{padding:8px}.n{font-size:12px;font-weight:700;min-height:32px}.hg{color:#f97316;font-weight:800}.btn{width:100%;background:#f97316;color:#fff;border:0;padding:10px;border-radius:8px;font-weight:800}.box{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:12px;border-radius:20px 20px 0 0;box-shadow:0 -8px 30px #0003;z-index:9999;border-top:3px solid #10b981;max-height:60vh;overflow:auto}.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee}.hapusBtn{background:#ef4444;color:#fff;border:0;padding:8px 14px;border-radius:8px;font-weight:800}.kirim{width:100%;background:#10b981;color:#fff;border:0;padding:16px;border-radius:12px;font-weight:900;font-size:16px;margin-top:10px}</style></head><body>
<div class="h">Meja <span id="mj">CEMPAKA</span> v19 - TEST KONEKSI FIREBASE</div>
<div class="g" id="grid">Loading...</div>
<div class="box">
<div style="font-weight:900;display:flex;justify-content:space-between"><span>Pesanan Kamu</span><span id="mejaLabel">CEMPAKA</span></div>
<div id="list" style="text-align:center;color:#999;padding:12px;background:#f9fafb;border-radius:8px;margin:6px 0">Belum ada pesanan</div>
<div style="display:flex;justify-content:space-between;font-weight:900"><span id="totalItem">0 item</span><span>Rp <span id="totalRp">0</span></span></div>
<button class="kirim" id="btnKirim">🚀 KIRIM KE DAPUR (TEST)</button>
<div id="status" style="font-size:11px;text-align:center;margin-top:8px;color:#666"></div>
<div id="debug" style="font-size:9px;color:#999;margin-top:4px;word-break:break-all"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getDatabase, ref, onValue, push, set } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";
const db=getDatabase(initializeApp({databaseURL:"https://restopro2026-60038-default-rtdb.asia-southeast1.firebasedatabase.app"}));
let meja=new URLSearchParams(location.search).get('meja')||'CEMPAKA';
document.getElementById('mj').textContent=meja; document.getElementById('mejaLabel').textContent=meja;
let menus=[],cart=[];

onValue(ref(db,'menu'),s=>{
  let v=s.val(); if(!v)return;
  let all=Object.entries(v).map(([id,o])=>({id,...o}));
  let seen=new Set(),uniq=[]; for(let m of all){let k=(m.nama||m.name||'').toLowerCase().trim(); if(k&&!seen.has(k)){seen.add(k);uniq.push(m);}}
  menus=uniq;
  document.getElementById('grid').innerHTML=menus.map(m=>`<div class="c"><img src="${m.image||m.gambar||''}" onerror="this.src='https://picsum.photos/seed/${m.id}/200'"><div class="p"><div class="n">${m.nama||m.name}</div><div class="hg">Rp ${(m.harga||m.price||0).toLocaleString('id-ID')}</div><button class="btn" onclick="tambah('${m.id}')">+ Pesan</button></div></div>`).join('');
});

window.tambah=(id)=>{let it=menus.find(x=>x.id==id); let ex=cart.find(x=>x.id==id); if(ex)ex.qty++; else cart.push({id,nama:it.nama||it.name,harga:it.harga||it.price,qty:1}); render();};
window.hapusItem=(i)=>{cart.splice(i,1); render();};
window.hapus=window.hapusItem;

function render(){
  let el=document.getElementById('list');
  if(cart.length==0){el.innerHTML='Belum ada pesanan'; document.getElementById('totalItem').textContent='0 item'; document.getElementById('totalRp').textContent='0'; return;}
  let total=0,jml=0;
  el.innerHTML=cart.map((x,i)=>{total+=x.harga*x.qty;jml+=x.qty; return `<div class="row"><div><b>${x.nama}</b> x${x.qty}<br><small>Rp ${(x.harga*x.qty).toLocaleString('id-ID')}</small></div><button class="hapusBtn" onclick="hapusItem(${i})">HAPUS</button></div>`}).join('');
  document.getElementById('totalItem').textContent=jml+' item'; document.getElementById('totalRp').textContent=total.toLocaleString('id-ID');
}

document.getElementById('btnKirim').onclick=async()=>{
  if(cart.length==0) return alert('Pilih menu dulu!');
  let btn=document.getElementById('btnKirim'), st=document.getElementById('status'), dbg=document.getElementById('debug');
  btn.textContent='MENGIRIM...'; btn.disabled=true; st.textContent='Menghubungkan ke Firebase...';
  try{
    let key=push(ref(db,'orders')).key;
    let total=cart.reduce((a,b)=>a+b.harga*b.qty,0);
    let payload={id:key, meja:meja, items:cart, total:total, status:'baru', catatan:'', waktu:new Date().toISOString(), test:true};
    st.textContent='Menulis ke /orders/'+key+' ...';
    dbg.textContent=JSON.stringify(payload).slice(0,200);
    await set(ref(db,'orders/'+key), payload);
    // tulis juga ke 2 tempat lain biar system lama kebaca
    await set(ref(db,'antrian/'+key), payload).catch(()=>{});
    await set(ref(db,'pesanan/'+key), payload).catch(()=>{});
    
    st.innerHTML='<span style="color:green;font-weight:900">✅ BERHASIL MASUK! Key: '+key+'<br>Cek Firebase > orders > '+key+'<br>Cek halaman Dapur sekarang!</span>';
    dbg.textContent='SUKSES: '+key+' | meja='+meja+' | total='+total;
    cart=[]; render();
    btn.textContent='✅ TERKIRIM! KIRIM LAGI?'; btn.disabled=false; btn.style.background='#10b981';
  }catch(e){
    st.innerHTML='<span style="color:red">❌ GAGAL: '+e.message+'</span>'; dbg.textContent=e.stack||e.message; btn.textContent='COBA LAGI'; btn.disabled=false;
    alert('GAGAL KIRIM: '+e.message);
  }
};
</script>
<style>
/* HILANGKAN BADGE POWERED BY NETLIFY - RESTOPRO */
div[style*="fixed"][style*="bottom: 0px"],
div[style*="fixed"][style*="bottom:0"],
iframe[src*="netlify"],
a[href*="netlify.com"] > div,
div[id*="netlify"] {
  display: none !important;
  opacity: 0 !important;
  pointer-events: none !important;
}
</style>
<script>
// backup hapus paksa badge netlify
setTimeout(()=>{
  document.querySelectorAll('div').forEach(d=>{
    if(d.textContent && d.textContent.includes('Powered by Netlify')){
      d.style.display='none';
      d.remove();
    }
  });
}, 1000);
</script>

</body>
</html>
