<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>CLEAN TRANSAKSI - FORCE DELETE</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-[#0f172a] text-white p-5 font-sans">
<h1 class="font-bold text-red-400 text-[16px]">🔥 FORCE DELETE TRANSAKSI SEBELUM 11 OKTOBER</h1>
<p class="text-[11px] text-slate-400 mt-2">Ini hapus paksa dari database transaksi + pettycash yang tanggalnya 4/10 dan 9/10 yang di foto kamu masih nyangkut itu.</p>

<div class="mt-4 bg-[#1e293b] p-4 rounded-xl">
  <label class="text-[11px]">HAPUS SEMUA DATA SEBELUM TANGGAL:</label>
  <div class="flex gap-2 mt-2">
    <input type="date" id="tgl" value="2026-10-11" class="bg-[#0f172a] border border-slate-600 rounded-lg p-2 text-[13px]">
    <button id="btnScan" class="bg-blue-500 px-5 py-2 rounded-lg font-bold text-[12px]">1. SCAN DULU</button>
    <button id="btnHapus" class="bg-red-600 px-5 py-2 rounded-lg font-bold text-[12px]">2. HAPUS PAKSA SEMUA</button>
  </div>
  <div id="log" class="mt-4 bg-black p-3 rounded-lg text-[11px] h-[400px] overflow-auto"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getDatabase, ref, get, remove, set, update } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";
const cfg={apiKey:"AIzaSyD6r1mm0Fm0gIioG2UcWQz0XtJHQj15iI",authDomain:"restopro2026-60038.firebaseapp.com",databaseURL:"https://restopro2026-60038-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"restopro2026-60038"};
const db=getDatabase(initializeApp(cfg));

let dataTransaksi=[], dataPetty=[];

function log(t){ document.getElementById('log').innerHTML+=t+"<br>"; }

function parseWaktu(waktuStr){
  if(!waktuStr) return new Date(0);
  try{
    let tglPart=waktuStr.split(',')[0].trim();
    let d,m,y;
    if(tglPart.includes('/')){ let p=tglPart.split('/'); d=parseInt(p[0]); m=parseInt(p[1])-1; y=parseInt(p[2]); }
    else if(tglPart.includes('-')){ let p=tglPart.split('-'); y=parseInt(p[0]); m=parseInt(p[1])-1; d=parseInt(p[2]); }
    else return new Date(waktuStr);
    return new Date(y,m,d);
  }catch(e){ return new Date(0); }
}

document.getElementById('btnScan').onclick=async()=>{
  let cutoff=document.getElementById('tgl').value;
  let cutoffDate=new Date(cutoff+"T00:00:00");
  log(`🔍 SCAN data sebelum ${cutoff}...`);

  let snapT=await get(ref(db,'transaksi'));
  dataTransaksi=[];
  if(snapT.exists()){
    Object.entries(snapT.val()).forEach(([k,v])=>{
      let tgl=parseWaktu(v.waktu);
      if(tgl < cutoffDate){
        dataTransaksi.push(k);
        log(`- TRANSAKSI MAU DIHAPUS: #${v.id} | ${v.waktu} | Rp ${v.total} | key: ${k}`);
      }
    });
  }
  log(`<b class="text-yellow-300">Total transaksi mau dihapus: ${dataTransaksi.length}</b>`);

  let snapP=await get(ref(db,'pettycash'));
  dataPetty=[];
  if(snapP.exists()){
    Object.entries(snapP.val()).forEach(([k,v])=>{
      if(v.tanggal && v.tanggal < cutoff){
        dataPetty.push(k);
        log(`- PETTYCASH MAU DIHAPUS: ${v.tanggal} | ${v.tipe} | ${v.keterangan} | Rp ${v.nominal}`);
      }
    });
  }
  log(`<b class="text-yellow-300">Total pettycash mau dihapus: ${dataPetty.length}</b>`);
  log(`<br>Kalau sudah benar, klik HAPUS PAKSA SEMUA beb.`);
};

document.getElementById('btnHapus').onclick=async()=>{
  if(dataTransaksi.length==0 && dataPetty.length==0) return alert('Scan dulu beb!');
  if(!confirm(`YAKIN HAPUS PAKSA ${dataTransaksi.length} transaksi + ${dataPetty.length} pettycash?`)) return;

  log(`<br>🔥 MULAI HAPUS...`);
  for(let k of dataTransaksi){
    try{
      await remove(ref(db,'transaksi/'+k));
      await set(ref(db,'transaksi/'+k), null);
      log(`✅ Terhapus transaksi ${k}`);
    }catch(e){ log(`❌ Gagal ${k}: ${e.message}`); }
  }
  for(let k of dataPetty){
    try{
      await remove(ref(db,'pettycash/'+k));
      await set(ref(db,'pettycash/'+k), null);
      log(`✅ Terhapus pettycash ${k}`);
    }catch(e){ log(`❌ Gagal petty ${k}: ${e.message}`); }
  }
  // coba bulk update null juga
  try{
    let updates={};
    dataTransaksi.forEach(k=> updates['transaksi/'+k]=null);
    dataPetty.forEach(k=> updates['pettycash/'+k]=null);
    await update(ref(db), updates);
    log(`✅ Bulk update null selesai`);
  }catch(e){ log(`Bulk gagal: ${e.message}`); }

  log(`<br><b class="text-green-400">✅ SELESAI BEB! Coba refresh laporan.html dan petty cash lagi. Harusnya yang 4/10 dan 9/10 di foto kamu udah ilang, dan saldo 11/10 balik jadi Rp 15.750, saldo awal 12/10 jadi Rp 15.750 nyambung.</b>`);
};
</script>
</body></html>
